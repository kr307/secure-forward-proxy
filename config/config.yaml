proxy:
  host: "0.0.0.0"
  port: 8080
  timeout: 30
  max_connections: 5000
  buffer_size: 65536

dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 8081

storage:
  db_path: "data/proxy_audit.db"

policy:
  default_action: "ALLOW"  # ALLOW or BLOCK if domain not explicitly matched
  enable_sni_sniffing: true
  categories_file: "config/categories.yaml"

auth:
  enabled: false  # When true, requires Proxy-Authorization: Basic <base64(user:pass)>
  users:
    admin: "admin123"
    analyst: "securepass456"
    testuser: "password"

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] [%(name)s] %(message)s"
